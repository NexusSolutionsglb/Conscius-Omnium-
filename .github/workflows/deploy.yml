name: Deploy to Cloudflare Workers

# Push-to-deploy for the Worker, since Cloudflare's Git-connected "Pages"
# flow can't run the OpenNext adapter's output — this replaces that.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # wrangler 4.x requires Node >= 22.
          node-version: 22
          cache: npm

      - run: npm ci

      # NEXT_PUBLIC_* values are inlined into the client bundle at BUILD
      # time, so they must be present here — not just as a Worker var/secret,
      # which only affects the *running* Worker, after the build already
      # happened. The four below are not sensitive (the anon key is
      # RLS-guarded and public by design) and already live in wrangler.jsonc,
      # so they're set inline to keep this workflow self-contained. The
      # optional analytics / verification ones are read from repo secrets if
      # you add them (Settings → Secrets and variables → Actions).
      - name: Build
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SITE_URL: https://consciusomnium.com
          NEXT_PUBLIC_SUPABASE_URL: https://mjvvyqxblcqssoctinoq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_zPotOUPRW-B6jFBbEHU1sQ_LKnWCcYG
          NEXT_PUBLIC_WHATSAPP_NUMBER: "919972910950"
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ secrets.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}

      # Server-only secrets (SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY, …) are
      # NOT set here — they're runtime values for the deployed Worker, pushed
      # once via `npx wrangler secret put <NAME>` (or the Cloudflare
      # dashboard) and persisted on Cloudflare's side.
      #
      # REQUIRED repo secrets for this step (Settings → Secrets and variables
      # → Actions): CLOUDFLARE_API_TOKEN (a token with the "Edit Cloudflare
      # Workers" permissions) and CLOUDFLARE_ACCOUNT_ID.
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
